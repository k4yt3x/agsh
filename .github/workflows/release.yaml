name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: meka-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: meka-windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: meka-macos-arm64

    runs-on: ${{ matrix.os }}

    env:
      BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.profile == 'release') && 'release' || 'debug' }}
      CARGO_FLAGS: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.profile == 'release') && '--release' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build ${{ env.CARGO_FLAGS }} --target ${{ matrix.target }}

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/meka staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/meka.exe" staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          # Take the body of "## [<version>] ..." up to the next "## [" heading, then trim blank lines
          # off the top and bottom. index()==1 is a literal prefix match, so the version's dots are not
          # treated as regex and 0.34.0 cannot match 0.34.01 (the closing "]" is part of the prefix).
          notes="$(
            awk -v ver="$version" '
              BEGIN { prefix = "## [" ver "]" }
              index($0, prefix) == 1 { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md | sed '/./,$!d' | tac | sed '/./,$!d' | tac
          )"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for '## [$version]' — add it before tagging."
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
          echo "--- release notes for $version ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*

  container:
    name: Build and push container
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/meka
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
